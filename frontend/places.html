<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Atractivos - Turismo Inteligente Colombia</title>
  <meta name="description" content="Explora los destinos naturales, culturales e históricos más impactantes de Colombia.">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos Personalizados de Vanguardia -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Bar Contract -->
  <header class="glass-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <i data-lucide="compass" style="width: 20px; height: 20px;"></i>
        </div>
        <span>Turismo Colombia</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="places.html" class="active">Lugares & Rutas</a></li>
          <li><a href="merchant.html">Portal Comerciante</a></li>
          <li><a href="admin.html">Administración</a></li>
        </ul>
      </nav>

      <div class="user-zone">
        <span id="user-current-role" class="role-badge tourist">Turista</span>
        <button id="btn-toggle-favorites" class="btn btn-outline" style="padding: 0.5rem 1rem;">
          <i data-lucide="heart" style="width: 16px; height: 16px; color: #ef4444;"></i>
          <span>Mis Favoritos (<span id="fav-count">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main style="max-width: 1320px; margin: 0 auto; padding: 3rem 1.5rem;">
    <!-- Encabezado de Sección -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1.5rem;">
      <div>
        <div style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--accent-terracotta); font-weight: 700; font-size: 0.8125rem; text-transform: uppercase;">
          <i data-lucide="mountain-snow" style="width: 16px; height: 16px;"></i>
          <span>Destinos Verificados</span>
        </div>
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-top: 0.25rem;">Atractivos Turísticos de Colombia</h1>
      </div>

      <!-- Barra de Búsqueda Minimalista -->
      <div style="position: relative; width: 100%; max-width: 380px;">
        <i data-lucide="search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
        <input type="text" id="places-search" placeholder="Buscar por nombre, parque o ciudad..." style="width: 100%; background: var(--bg-surface); border: 1px solid var(--glass-border); padding: 0.75rem 1rem 0.75rem 2.75rem; border-radius: 14px; color: var(--text-primary); outline: none; font-size: 0.9375rem;">
      </div>
    </div>

    <!-- Pestañas de Filtro por Categoría con Iconos Lineales Modernos -->
    <div style="display: flex; gap: 0.75rem; margin-bottom: 2.5rem; flex-wrap: wrap;" id="category-filter-group">
      <button class="btn btn-primary filter-tab active" data-category="Todos">
        <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
        <span>Todos</span>
      </button>
      <button class="btn btn-outline filter-tab" data-category="Aventura">
        <i data-lucide="compass" style="width: 16px; height: 16px; color: var(--accent-emerald-light);"></i>
        <span>Aventura & Naturaleza</span>
      </button>
      <button class="btn btn-outline filter-tab" data-category="Cultural">
        <i data-lucide="palette" style="width: 16px; height: 16px; color: var(--accent-terracotta);"></i>
        <span>Cultural</span>
      </button>
      <button class="btn btn-outline filter-tab" data-category="Histórico">
        <i data-lucide="landmark" style="width: 16px; height: 16px; color: var(--accent-gold);"></i>
        <span>Histórico</span>
      </button>
    </div>

    <!-- Contenedor de Skeletons (Loaders de Alto Esfuerzo) -->
    <div id="places-skeleton-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem;">
      <div class="skeleton-card">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton-text-group">
          <div class="skeleton" style="height: 14px; width: 40%;"></div>
          <div class="skeleton" style="height: 22px; width: 85%;"></div>
          <div class="skeleton" style="height: 14px; width: 100%;"></div>
          <div class="skeleton" style="height: 14px; width: 70%;"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton-text-group">
          <div class="skeleton" style="height: 14px; width: 35%;"></div>
          <div class="skeleton" style="height: 22px; width: 80%;"></div>
          <div class="skeleton" style="height: 14px; width: 100%;"></div>
          <div class="skeleton" style="height: 14px; width: 65%;"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton-text-group">
          <div class="skeleton" style="height: 14px; width: 45%;"></div>
          <div class="skeleton" style="height: 22px; width: 90%;"></div>
          <div class="skeleton" style="height: 14px; width: 100%;"></div>
          <div class="skeleton" style="height: 14px; width: 75%;"></div>
        </div>
      </div>
    </div>

    <!-- Grid Real de Tarjetas de Lugares -->
    <div id="places-grid" style="display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem;">
      <!-- Se inyecta dinámicamente desde places.js -->
    </div>

    <!-- Estado Vacío -->
    <div id="places-empty-state" style="display: none; text-align: center; padding: 4rem 1rem;" class="glass-panel">
      <i data-lucide="map-pin-off" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 1rem;"></i>
      <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">No se encontraron atractivos</h3>
      <p style="color: var(--text-secondary); font-size: 0.9375rem;">Intenta con otros términos de búsqueda o selecciona otra categoría.</p>
    </div>
  </main>

  <!-- Modal Detalle del Atractivo (Glassmorphism) -->
  <div id="place-detail-modal" style="display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(12,16,23,0.85); backdrop-filter: blur(12px); align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="glass-panel" style="max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative; border-radius: 24px;">
      <button id="close-modal-btn" style="position: absolute; top: 1.25rem; right: 1.25rem; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-radius: 50%; width: 36px; height: 36px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <i data-lucide="x" style="width: 18px; height: 18px;"></i>
      </button>

      <div id="modal-content">
        <!-- Inyectado dinámicamente -->
      </div>
    </div>
  </div>

  <!-- Contenedor de Alertas RBAC -->
  <div id="rbac-alert-container"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script src="places.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
