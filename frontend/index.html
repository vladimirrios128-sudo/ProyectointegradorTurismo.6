<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Turismo Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center font-sans">

    <!-- Tarjeta Principal de Login / Registro -->
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl mb-1">
                <span class="text-2xl" id="headerIcon">🔐</span>
            </div>
            <h2 class="text-xl font-bold text-white" id="formTitle">Iniciar Sesión</h2>
            <p class="text-xs text-slate-400" id="formSubtitle">Plataforma Inteligente de Rutas Turísticas</p>
        </div>

        <!-- Pestañas (Iniciar Sesión / Registrarse) -->
        <div class="flex border-b border-slate-800 text-xs font-bold text-center">
            <button type="button" id="tabLogin" class="w-1/2 py-2 border-b-2 border-amber-500 text-amber-500 transition-all">
                Iniciar Sesión
            </button>
            <button type="button" id="tabRegister" class="w-1/2 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition-all">
                Registrarse
            </button>
        </div>

        <!-- Formulario -->
        <form id="authForm" class="space-y-4">
            <!-- Campo Nombre Completo (solo visible en Registro) -->
            <div id="fullNameGroup" class="hidden">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Nombre Completo</label>
                <input type="text" id="nameInput" placeholder="Ej: Vladimir Ríos" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Correo Electrónico</label>
                <input type="email" id="emailInput" required value="JuanAdmin@gmail.com" placeholder="tu_correo@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Contraseña</label>
                <input type="password" id="passwordInput" required value="12345678" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-amber-500 transition">
                <p class="text-[9px] text-slate-500 mt-1">Requisito: Mínimo 8 caracteres y 2 especiales (ej: @, #, $, !)</p>
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide block mb-1">Rol / Permiso de Usuario</label>
                <select id="roleSelect" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-amber-500 transition">
                    <option value="super_admin">Super Admin</option>
                    <option value="merchant">Admin Comercio</option>
                    <option value="tourist" selected>Turista</option>
                    <option value="auditor">Auditor</option>
                </select>
            </div>

            <div id="statusMessage" class="hidden text-center text-xs p-2.5 rounded-xl font-medium"></div>

            <button type="submit" id="btnSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-1.5 active:scale-98">
                Iniciar Sesión →
            </button>
        </form>
    </div>

    <!-- Modal Emergente 2FA -->
    <div id="modal2FA" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl text-center">
            <div class="text-3xl">📩</div>
            <h3 class="text-base font-bold text-amber-500">Verificación en Dos Pasos (2FA)</h3>
            <p class="text-xs text-slate-400">Hemos enviado un código de 6 dígitos a tu correo electrónico. Ingrésalo a continuación para continuar.</p>

            <input type="text" id="otpInput" maxlength="6" placeholder="000000" class="w-full text-center text-lg font-mono tracking-widest bg-slate-950 border border-slate-700 text-amber-400 rounded-xl p-3 focus:outline-none focus:border-amber-500">

            <p id="otpError" class="text-[11px] text-rose-500 hidden font-semibold"></p>

            <div class="flex gap-2">
                <button type="button" id="btnCancel2FA" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition">
                    Cancelar
                </button>
                <button type="button" id="btnVerify2FA" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-xl text-xs transition shadow-md">
                    Verificar
                </button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
